; ============================================================
; CompagnonV2 — platformio.ini
; Framework : Arduino (arduino-esp32 3.3.8)
; LVGL      : 9.3.0
; Target    : ESP32-S3 — Waveshare AMOLED 2.16" 480×480
; Flash     : 16 MB — PSRAM OPI 8 MB
; ============================================================

[env:compagnon_s3]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = arduino

; Arduino-ESP32 version exacte
platform_packages     =
    platformio/framework-arduinoespressif32 @ 3.3.8

; Partition table custom 16 MB
board_build.partitions      = partitions/compagnon_16mb.csv
board_build.flash_size      = 16MB
board_build.flash_mode      = qio
board_build.arduino.memory_type = qio_opi   ; PSRAM OPI

; CPU 240 MHz
board_build.f_cpu    = 240000000L

; USB CDC pour upload + monitor
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; LVGL config
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; Safe area display
    -DBOARD_HAS_PSRAM

; Librairies
lib_deps =
    ; LVGL 9.3.0 exact
    lvgl/lvgl @ 9.3.0
    ; ArduinoJson
    bblanchon/ArduinoJson @ ^7.3
    ; AXP2101 PMU
    lewisxhe/XPowersLib @ ^0.2
    ; I2C générique
    Wire
    SPI

; Upload / Monitor
monitor_speed       = 115200
upload_speed        = 921600
