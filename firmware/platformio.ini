[env:compagnon_v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Partition table
board_build.partitions = ../partitions/partitions.csv

; Flash size
board_upload.flash_size = 8MB
board_build.flash_mode = qio

; Build flags
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_LOG=0
    ; Bundle CA Mozilla pour WiFiClientSecure
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
    -DCONFIG_ESP_TLS_INSECURE=n

; Arduino 3.3.8
platform_packages =
    framework-arduinoespressif32 @ 3.3.8

; Bibliothèques
lib_deps =
    lvgl/lvgl @ ^8.4.0
    bblanchon/ArduinoJson @ ^7.0.0
    FFat
    WiFi
    WiFiClientSecure
    HTTPClient
    Preferences
    Wire

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload
upload_speed = 921600
