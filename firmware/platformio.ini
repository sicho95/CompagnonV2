; ============================================================
; CompagnonV2 — platformio.ini
; Framework : Arduino ESP32 3.3.8 (IDF 5.5.4)
; LVGL      : 9.x
; Target    : ESP32-S3 — Waveshare AMOLED 2.16" 466×466
; Flash     : 16 MB — PSRAM OPI 8 MB
; ============================================================

[env:compagnon_s3]
platform              = espressif32
board                 = esp32-s3-devkitc-1
framework             = arduino

; Arduino-ESP32 3.3.8 exact (basé sur IDF 5.5.4)
platform_packages     =
    platformio/framework-arduinoespressif32 @ 3.3.8

; Partition table custom 16 MB
board_build.partitions      = partitions/compagnon_16mb.csv
board_build.flash_size      = 16MB
board_build.flash_mode      = qio
board_build.arduino.memory_type = qio_opi   ; PSRAM OPI 8MB

; CPU 240 MHz
board_build.f_cpu    = 240000000L

build_flags =
    ; USB CDC upload + monitor
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; PSRAM
    -DBOARD_HAS_PSRAM
    ; LVGL 9 — config via lv_conf.h dans src/config/
    -DLV_CONF_INCLUDE_SIMPLE
    -I$PROJECT_SRC_DIR/config

; Librairies
lib_deps =
    ; LVGL 9.x
    lvgl/lvgl @ ^9.0
    ; Display CO5300 QSPI (moononournation Arduino_GFX)
    moononournation/GFX Library for Arduino @ ^1.4
    ; SensorLib : CST9220 touch + PCF85063 RTC + QMI8658 IMU
    lewisxhe/SensorLib @ ^0.2
    ; AXP2101 PMU driver officiel
    lewisxhe/XPowersLib @ ^0.2
    ; ArduinoJson v7
    bblanchon/ArduinoJson @ ^7.3
    ; Wire + SPI inclus dans le framework Arduino

monitor_speed       = 115200
upload_speed        = 921600
